name: Daily journal post

# Publishes one Omnivibe Daily Journal Markdown file per day.
# Merge/push to main triggers the existing Vercel production deploy.

on:
  schedule:
    # 08:30 IST (03:00 UTC) every day
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional post date (YYYY-MM-DD). Defaults to today UTC."
        required: false
        type: string
      mode:
        description: "publish = commit to main (live after Vercel). pr = open a review PR."
        required: false
        type: choice
        options:
          - publish
          - pr
        default: publish
      force:
        description: "Create even if a post already exists for the date"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  daily-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate today's post
        id: generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          DAILY_BLOG_MODEL: ${{ vars.DAILY_BLOG_MODEL }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${{ inputs.date }}" ]; then
            ARGS+=(--date "${{ inputs.date }}")
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS+=(--force)
          fi
          python3 scripts/daily-blog/generate_post.py "${ARGS[@]}" | tee /tmp/daily-blog-out.txt
          CREATED=$(grep '^CREATED=' /tmp/daily-blog-out.txt | tail -n1 | cut -d= -f2- || true)
          if [ -z "$CREATED" ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "No new post file created (already published for this date, or skipped)."
          else
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "path=$CREATED" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect publish mode
        id: mode
        run: |
          INPUT_MODE="${{ inputs.mode }}"
          if [ -n "$INPUT_MODE" ]; then
            echo "value=$INPUT_MODE" >> "$GITHUB_OUTPUT"
          elif [ "${{ vars.DAILY_BLOG_MODE }}" = "pr" ]; then
            echo "value=pr" >> "$GITHUB_OUTPUT"
          else
            echo "value=publish" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push to main
        if: steps.generate.outputs.created == 'true' && steps.mode.outputs.value == 'publish'
        run: |
          set -euo pipefail
          git config user.name "omnivibe-daily-blog"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.generate.outputs.path }}"
          git commit -m "Add daily journal: $(basename '${{ steps.generate.outputs.path }}' .post.md)"
          git push origin HEAD:main

      - name: Open review pull request
        if: steps.generate.outputs.created == 'true' && steps.mode.outputs.value == 'pr'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PATH_NAME="${{ steps.generate.outputs.path }}"
          SLUG=$(basename "$PATH_NAME" .post.md)
          BRANCH="daily-blog/${SLUG}"
          git config user.name "omnivibe-daily-blog"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$PATH_NAME"
          git commit -m "Add daily journal: $SLUG"
          git push -u origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Daily journal: $SLUG" \
            --body "Automated Omnivibe Daily Journal draft from \`scripts/daily-blog\`.

Merge to publish on the live site (Vercel builds \`main\`)."
